apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  DB_URL: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/{{ .Values.database.name }}"
  DB_USERNAME: {{ .Values.database.username | quote }}
  SPRING_PROFILES_ACTIVE: "docker"
