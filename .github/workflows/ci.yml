
name: Spring Boot DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-test-quality:
    name: Build, Test and Sonar Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Build and Tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify


      - name: SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

        run: |
          test -n "$SONAR_TOKEN" || exit 1
          test -n "$SONAR_ORGANIZATION" || exit 1
          test -n "$SONAR_PROJECT_KEY" || exit 1

          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  docker-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: build-test-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t library-management-system:${{ github.sha }} .

      
      
      - name: Trivy Vulnerability Scan
        run: |
          mkdir -p "$HOME/.cache/trivy"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.65.0 \
            image \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --vuln-type os,library \
            "library-management-system:${GITHUB_SHA}"

      - name: Docker Hub Login
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker Image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/library-management-system
        run: |
          docker tag library-management-system:${GITHUB_SHA} $IMAGE_NAME:${GITHUB_SHA}
          docker tag library-management-system:${GITHUB_SHA} $IMAGE_NAME:latest

          docker push $IMAGE_NAME:${GITHUB_SHA}
          docker push $IMAGE_NAME:latest
