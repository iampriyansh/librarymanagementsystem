apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-management-app
  namespace: library-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-management-app
  template:
    metadata:
      labels:
        app: library-management-app
    spec:
      containers:
        - name: app
          image: priyanshch1105/library-management-system:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: library-management-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-management-secrets
                  key: DB_PASSWORD
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
